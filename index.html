<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warung Jajanan Seblak - Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
  --accent-color: #f43f5e;
  --glass-bg: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.1);
  --text-main: #f8fafc;
  --text-dim: #94a3b8;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
body {
  background: var(--primary-gradient);
  background-attachment: fixed;
  color: var(--text-main);
  min-height: 100vh;
  padding-bottom: 120px;
}
.header-menu { text-align: center; padding: 40px 20px; }
.logo-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
.main-logo {
  width: 150px; height: 150px; object-fit: cover; border-radius: 50%;
  margin-bottom: 15px; border: 3px solid var(--glass-border);
  background: white; box-shadow: 0 0 25px rgba(244, 63, 94, 0.5);
  transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.main-logo:hover { transform: scale(1.1) rotate(5deg); border-color: var(--accent-color); }
h1 {
  font-weight: 800; font-size: 2.5rem; letter-spacing: -1px;
  background: linear-gradient(to right, #fff, #f43f5e);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 25px;
}
.search-box { max-width: 500px; margin: 0 auto; position: relative; }
.search-box input {
  width: 100%; padding: 15px 25px; border-radius: 30px;
  border: 1px solid var(--glass-border); background: var(--glass-bg);
  backdrop-filter: blur(10px); color: white; font-size: 1rem;
  transition: all 0.3s ease; outline: none;
}
.search-box input:focus { border-color: var(--accent-color); box-shadow: 0 0 20px rgba(244, 63, 94, 0.2); }
.produk-container {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 25px; max-width: 1200px; margin: 0 auto; padding: 20px;
}
.produk {
  background: var(--glass-bg); backdrop-filter: blur(15px);
  border: 1px solid var(--glass-border); border-radius: 24px;
  padding: 20px; display: flex; flex-direction: column;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.produk:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); border-color: rgba(244, 63, 94, 0.3); }
.produk img { width: 100%; height: 200px; object-fit: cover; border-radius: 18px; margin-bottom: 15px; }
.produk h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 5px; }
.harga { color: var(--accent-color); font-weight: 800; font-size: 1.4rem; margin-bottom: 15px; transition: all 0.2s ease; }
.note-container { margin-bottom: 20px; }
.note-label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 8px; }
.note-input {
  width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border);
  padding: 10px 15px; border-radius: 12px; color: white; font-size: 0.9rem; outline: none;
}
.note-input:focus { border-color: var(--accent-color); }

/* Opsi tambahan (clickable priced add-ons) */
.opsi-container { margin-bottom: 20px; }
.opsi-list { display: flex; flex-wrap: wrap; gap: 8px; }
.opsi-chip {
  background: rgba(0,0,0,0.25); border: 1px solid var(--glass-border);
  color: var(--text-main); font-size: 0.8rem; font-weight: 600;
  padding: 8px 14px; border-radius: 30px; cursor: pointer;
  transition: all 0.2s ease; outline: none;
}
.opsi-chip:hover { border-color: var(--accent-color); }
.opsi-chip.active {
  background: var(--accent-color); border-color: var(--accent-color); color: white;
  box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4);
}

.counter {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(0,0,0,0.3); border-radius: 15px; padding: 5px; margin-top: auto;
}
.counter button {
  width: 40px; height: 40px; border-radius: 12px; border: none;
  background: var(--accent-color); color: white; font-size: 1.2rem;
  font-weight: bold; cursor: pointer; transition: opacity 0.2s;
}
.counter button:active { opacity: 0.7; }
.jumlah { font-weight: 700; font-size: 1.1rem; }
.checkout-container {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);
  padding: 20px; border-top: 1px solid var(--glass-border);
  display: flex; justify-content: center; z-index: 100;
}
#checkout-button {
  background: var(--accent-color); color: white; border: none;
  padding: 15px 60px; font-size: 1.1rem; font-weight: 700;
  border-radius: 30px; cursor: pointer;
  box-shadow: 0 10px 20px rgba(244, 63, 94, 0.3); transition: all 0.3s ease;
}
#checkout-button:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(244, 63, 94, 0.5); }
.loading {
  text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 1.1rem;
}
.loading-spinner {
  width: 40px; height: 40px; border: 3px solid var(--glass-border);
  border-top-color: var(--accent-color); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 15px;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 600px) { h1 { font-size: 1.8rem; } .produk-container { padding: 15px; } .main-logo { width: 110px; height: 110px; } }
</style>
</head>
<body>

<div class="header-menu">
  <div class="logo-container">
    <img src="https://raw.githubusercontent.com/sailorr-ui/WebsiteWarungJajananSeblak/refs/heads/main/Logo%20Warung%20Seblak%20Jajanan%20vintage.png"
         alt="Logo Warung Jajanan Seblak" class="main-logo">
    <h1>Warung Jajanan Seblak</h1>
  </div>
  <div class="search-box">
    <input type="text" id="search-menu" placeholder="Cari menu favoritmu...">
  </div>
</div>

<div class="produk-container" id="produk-container">
  <div class="loading" style="grid-column: 1/-1;">
    <div class="loading-spinner"></div>
    <p>Memuat menu...</p>
  </div>
</div>

<div class="checkout-container">
  <button id="checkout-button">Checkout Sekarang</button>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyByJZfVx5RjFVWCbpSOJ5gfeHnmvq8_pbA",
  authDomain: "warung-ilyasah-76d92.firebaseapp.com",
  projectId: "warung-ilyasah-76d92",
  storageBucket: "warung-ilyasah-76d92.firebasestorage.app",
  messagingSenderId: "144030007267",
  appId: "1:144030007267:web:c9ca13753ad98a7f4aead6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const container = document.getElementById('produk-container');

function formatRp(n) {
  return 'Rp' + Number(n).toLocaleString('id-ID');
}

async function loadMenu() {
  try {
    const q = query(collection(db, "menu"), orderBy("urutan"));
    const snapshot = await getDocs(q);
    container.innerHTML = "";

    snapshot.forEach(docSnap => {
      const m = docSnap.data();
      const opsiTambahan = Array.isArray(m.opsi_tambahan) ? m.opsi_tambahan : [];

      const card = document.createElement('div');
      card.className = 'produk';
      card.dataset.nama = m.nama.toLowerCase();

      // Bagian opsi tambahan ATAU catatan bebas (fallback jika menu belum punya opsi)
      let extraSectionHTML = '';
      if (opsiTambahan.length > 0) {
        extraSectionHTML = `
          <div class="opsi-container">
            <label class="note-label">${m.note_label || 'Opsi Tambahan'}</label>
            <div class="opsi-list"></div>
          </div>
        `;
      } else {
        extraSectionHTML = `
          <div class="note-container">
            <label class="note-label">${m.note_label || 'Catatan'}</label>
            <input type="text" class="note note-input" placeholder="Tambahkan catatan...">
          </div>
        `;
      }

      card.innerHTML = `
        <img src="${m.gambar}" alt="${m.nama}" onerror="this.src='https://placehold.co/400x200/1e1b4b/f43f5e?text=No+Image'">
        <h2>${m.nama}</h2>
        <p class="harga">${formatRp(m.harga)}</p>
        ${extraSectionHTML}
        <div class="counter">
          <button class="minus">-</button>
          <span class="jumlah">0</span>
          <button class="plus">+</button>
        </div>
      `;

      // State per-card: opsi tambahan yang sedang dipilih (hanya 1 pada satu waktu, atau tidak ada)
      let selectedOpsi = null; // { label, harga }
      const hargaElem = card.querySelector('.harga');

      function updateHargaDisplay() {
        const totalSatuan = Number(m.harga) + (selectedOpsi ? Number(selectedOpsi.harga) : 0);
        hargaElem.textContent = formatRp(totalSatuan);
      }

      if (opsiTambahan.length > 0) {
        const opsiList = card.querySelector('.opsi-list');
        opsiTambahan.forEach(opsi => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'opsi-chip';
          chip.textContent = `${opsi.label} (+${formatRp(opsi.harga)})`;
          chip.addEventListener('click', () => {
            const isActive = chip.classList.contains('active');
            // reset semua chip di produk ini (hanya 1 opsi aktif per produk)
            opsiList.querySelectorAll('.opsi-chip').forEach(c => c.classList.remove('active'));
            if (isActive) {
              selectedOpsi = null; // klik lagi opsi yang sama = batal pilih
            } else {
              chip.classList.add('active');
              selectedOpsi = { label: opsi.label, harga: Number(opsi.harga) };
            }
            updateHargaDisplay();
          });
          opsiList.appendChild(chip);
        });
      }

      // Counter logic
      const plus = card.querySelector('.plus');
      const minus = card.querySelector('.minus');
      const jumlahElem = card.querySelector('.jumlah');
      let jumlah = 0;
      plus.addEventListener('click', () => { jumlah++; jumlahElem.textContent = jumlah; });
      minus.addEventListener('click', () => { if (jumlah > 0) { jumlah--; jumlahElem.textContent = jumlah; } });

      // Simpan getter data pesanan di elemen card, dipakai saat checkout
      card._getPesananData = () => {
        const noteInput = card.querySelector('.note-input');
        return {
          nama: m.nama,
          hargaDasar: Number(m.harga),
          harga: Number(m.harga) + (selectedOpsi ? Number(selectedOpsi.harga) : 0),
          jumlah: jumlah,
          note: noteInput ? noteInput.value.trim() : '',
          opsiLabel: selectedOpsi ? selectedOpsi.label : '',
          opsiHarga: selectedOpsi ? Number(selectedOpsi.harga) : 0
        };
      };

      container.appendChild(card);
    });

    if (snapshot.empty) {
      container.innerHTML = `<div class="loading" style="grid-column:1/-1"><p>Menu belum tersedia.</p></div>`;
    }
  } catch (err) {
    console.error(err);
    container.innerHTML = `<div class="loading" style="grid-column:1/-1"><p>Gagal memuat menu. Coba refresh halaman.</p></div>`;
  }
}

loadMenu();

// Search
document.getElementById('search-menu').addEventListener('keyup', function() {
  const keyword = this.value.toLowerCase();
  document.querySelectorAll('.produk').forEach(item => {
    item.style.display = item.dataset.nama.includes(keyword) ? 'flex' : 'none';
  });
});

// Checkout
document.getElementById('checkout-button').addEventListener('click', () => {
  const pesanan = [];
  document.querySelectorAll('.produk').forEach(produk => {
    if (typeof produk._getPesananData !== 'function') return;
    const data = produk._getPesananData();
    if (data.jumlah > 0) {
      pesanan.push(data);
    }
  });

  if (pesanan.length === 0) {
    const toast = document.createElement('div');
    toast.style.cssText = "position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#f43f5e;color:white;padding:15px 30px;border-radius:10px;z-index:1000;font-weight:600;box-shadow:0 5px 15px rgba(0,0,0,0.3);";
    toast.textContent = "Pilih minimal satu menu dulu ya!";
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
    return;
  }

  localStorage.setItem("pesanan", JSON.stringify(pesanan));
  window.location.href = "checkout.html";
});
</script>
</body>
</html>
